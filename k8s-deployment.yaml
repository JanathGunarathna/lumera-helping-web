
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lumera-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lumera-frontend
  template:
    metadata:
      labels:
        app: lumera-frontend
    spec:
      containers:
        - name: lumera-frontend
          image: janathgunarathna/lumera-frontend:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
